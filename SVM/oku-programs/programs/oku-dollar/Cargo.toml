[package]
name = "oku-dollar"
version = "0.1.0"
description = "OkuDollar vault - rebasing $1-pegged stablecoin backed by OkuMoney"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oku_dollar"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"
lite-psm = { path = "../lite-psm", features = ["cpi"] }
