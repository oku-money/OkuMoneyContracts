[package]
name = "oku-bridge-router"
version = "0.1.0"
description = "OkuBridgeRouter - Convenience wrapper for bridging wOkuUSD cross-chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oku_bridge_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
wokusd-vault = { path = "../wokusd-vault", features = ["cpi"] }
lite-psm = { path = "../lite-psm", features = ["cpi"] }
