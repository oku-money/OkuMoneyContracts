name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EVM
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Compile with Hardhat
        run: npx hardhat compile

      - name: Export ABIs
        run: npm run export-abis

      - name: Check exported artifacts are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain artifacts/evm/)" ]; then
            echo "::error::artifacts/evm/ is out of date. Run \`cd EVM && npx hardhat compile && npm run export-abis\` and commit the result."
            git status --porcelain artifacts/evm/
            git diff artifacts/evm/ | head -200
            exit 1
          fi
