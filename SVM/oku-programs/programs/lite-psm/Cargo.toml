[package]
name = "lite-psm"
version = "0.1.0"
description = "LitePSM - USDC to OkuUSD peg stability module"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lite_psm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
