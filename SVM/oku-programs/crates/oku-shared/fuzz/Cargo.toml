[package]
name = "oku-shared-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oku-shared = { path = ".." }

# Disable overflow-checks for the fuzz crate itself so that
# cargo-fuzz's sanitizers (ASAN, UBSan) can catch overflows
# rather than Rust's built-in panic, which would mask the bug.
[[bin]]
name = "raw_to_dollars"
path = "fuzz_targets/raw_to_dollars.rs"
test = false
doc = false

[[bin]]
name = "dollars_to_raw"
path = "fuzz_targets/dollars_to_raw.rs"
test = false
doc = false

# --- streaming-accrual targets (added with the 1e18 / rate-schedule port) ---

# The 256-bit WAD multiply-divide underneath every multiplier operation.
# Checked against a 32-bit-limb oracle of deliberately different shape.
[[bin]]
name = "wad_mul_div"
path = "fuzz_targets/wad_mul_div.rs"
test = false
doc = false

# The streaming accrual function itself: monotonicity, clamping, bounded
# overhang, and the never-panics property its EVM counterpart is fuzzed for.
[[bin]]
name = "compute_multiplier"
path = "fuzz_targets/compute_multiplier.rs"
test = false
doc = false
