[profile.default]
src = "src"
# Allow the differential-vector generator to write its corpus. Scoped to the
# single directory it owns — see test/differential/GenerateVectors.t.sol.
fs_permissions = [{ access = "read-write", path = "./test/differential" }]

out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Test settings
verbosity = 2
fuzz = { runs = 256 }
# Explicit invariant config (was previously relying on Foundry defaults,
# which happen to match: 256 runs x 500 depth).
invariant = { runs = 256, depth = 500 }

# Gas reporting
gas_reports = ["*"]

# Additional remappings (add your dependencies here)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Formatting options (for forge fmt)
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# Lint configuration
[lint]
exclude_lints = ["asm-keccak256"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
