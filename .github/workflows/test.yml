name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # EVM: forge test + hardhat compile/test + ABI drift check
  # ---------------------------------------------------------------------------
  check:
    name: EVM (Foundry + Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EVM
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned: forge-lint gains new lints between releases, and an unpinned
      # toolchain turned CI red on unchanged source. The lint ids in src/ and
      # foundry.toml's `exclude_lints` need >= 1.8. Bump
      # deliberately, re-running `forge lint src/ --deny warnings` locally.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      # Scoped to src/ deliberately. test/ carries ~32 erc20-unchecked-transfer
      # warnings on intentional setup calls where the return value is genuinely
      # uninteresting; gating those would mean annotating noise, not finding bugs.
      - name: Run Forge lint (src/ only, warnings are errors)
        run: forge lint src/ --deny warnings

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run Forge coverage (line threshold = 95%)
        run: |
          # Exclude test mocks / harnesses from the coverage run itself.
          forge coverage --no-match-coverage 'test/|script/' --report summary | tee coverage.txt

          # Gate: every src/ file must have >= 95% line coverage, and the
          # overall Total line must be >= 95%. Parses the rendered summary
          # table. Awk-only — no jq/python needed in CI.
          awk -F'|' '
            /^\| (src\/|Total)/ {
              # Strip leading/trailing whitespace from each field.
              for (i = 1; i <= NF; i++) {
                gsub(/^[ \t]+|[ \t]+$/, "", $i)
              }
              file = $2
              lines = $3
              # Extract the percentage (e.g. "98.43% (188/191)" -> 98.43).
              if (match(lines, /[0-9]+\.[0-9]+/)) {
                pct = substr(lines, RSTART, RLENGTH) + 0
                printf "  %-50s %s\n", file, lines
                if (pct < 95.0) {
                  printf "::error::%s line coverage %s is below 95%% threshold\n", file, lines
                  failed = 1
                }
              }
            }
            END { exit failed }
          ' coverage.txt

          # Gate 2: overall BRANCH coverage. Per-file would be the stronger
          # shape, but a few branches in src/ are provably unreachable (see
          # EVM/README "Uncovered lines and branches (intentional)"), which caps OkuDollar's
          # per-file figure through no fault of the suite. A total gate catches
          # the regression that matters -- someone adding an untested
          # conditional -- without encoding that cap as a per-file exception.
          # 94%, not 95%: the 5 deliberately-unreachable revert arms are a large share
          # of only ~120 branches, so a 95% gate left room for one new gap.
          awk -F'|' '
            /^\| Total/ {
              for (i = 1; i <= NF; i++) { gsub(/^[ \t]+|[ \t]+$/, "", $i) }
              branches = $5
              if (match(branches, /[0-9]+\.[0-9]+/)) {
                pct = substr(branches, RSTART, RLENGTH) + 0
                printf "  %-50s %s\n", "TOTAL branches", branches
                if (pct < 94.0) {
                  printf "::error::total branch coverage %s is below 94%% threshold\n", branches
                  exit 1
                }
              }
            }
          ' coverage.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Compile with Hardhat
        run: npx hardhat compile

      - name: Run TypeScript type-check (EVM)
        run: npm run typecheck

      # packages/yield-tooling holds the shared multiplier math that the
      # differential corpus is generated against. It was previously only
      # exercised transitively by importers, never type-checked on its own.
      - name: Run TypeScript type-check (yield-tooling)
        working-directory: ${{ github.workspace }}
        run: npm run build --workspace @okumoney/yield-tooling

      # The fork block is pinned when ANKR_FREEMIUM_API_KEY (archive RPC) is available,
      # which also makes Hardhat's on-disk fork cache effective.
      - name: Cache Hardhat fork state
        uses: actions/cache@v4
        with:
          path: EVM/cache_hardhat/hardhat-network-fork
          key: hardhat-fork-${{ hashFiles('EVM/scripts/config/rpc.ts') }}

      - name: Run Hardhat tests
        run: npx hardhat test
        env:
          FORK_NETWORK: mainnet
          ANKR_FREEMIUM_API_KEY: ${{ secrets.ANKR_FREEMIUM_API_KEY }}

      - name: Export ABIs
        run: npm run export-abis

      - name: Check exported artifacts are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain artifacts/evm/)" ]; then
            echo "::error::artifacts/evm/ is out of date. Run \`cd EVM && npx hardhat compile && npm run export-abis\` and commit the result."
            git status --porcelain artifacts/evm/
            git diff artifacts/evm/ | head -200
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # SVM: Anchor build + bankrun tests + cargo unit tests
  #
  # Uses Solana v3.1.10 + Anchor CLI v1.0.2 to match Anchor.toml [toolchain].
  # The bankrun suite (litesvm, in-process) does NOT require a running validator.
  # ---------------------------------------------------------------------------
  svm-tests:
    name: SVM (Anchor build + bankrun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVM/oku-programs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('SVM/oku-programs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Solana install
        uses: actions/cache@v4
        id: solana-cache
        with:
          path: ~/.local/share/solana
          key: solana-3.1.10

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Anchor CLI
        uses: actions/cache@v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-1.0.2

      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v1.0.2 anchor-cli --locked --force

      - name: Assert the Anchor CLI matches Anchor.toml
        # CI installed 1.0.0 while Anchor.toml, Cargo.toml and Cargo.lock all
        # declared 1.0.2, so builds were verified against a different compiler
        # than the one developers and the lockfile use. Fail fast on drift
        # rather than discovering it through a behaviour difference.
        run: |
          DECLARED=$(grep -oP 'anchor_version\s*=\s*"\K[^"]+' Anchor.toml)
          INSTALLED=$(anchor --version | grep -oP 'anchor-cli \K\S+')
          echo "Anchor.toml declares $DECLARED; installed $INSTALLED"
          if [ "$DECLARED" != "$INSTALLED" ]; then
            echo "::error::Anchor CLI $INSTALLED does not match Anchor.toml $DECLARED"
            exit 1
          fi

      - name: Show tool versions
        run: |
          solana --version
          anchor --version
          node --version

      - name: Generate Solana keypair for CI
        run: solana-keygen new --no-bip39-passphrase --silent

      - name: Install npm dependencies
        run: npm ci

      - name: Build Anchor programs
        run: anchor build --ignore-keys

      - name: Export IDLs
        run: npm run export-idls

      - name: Check exported SVM artifacts are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain artifacts/svm/)" ]; then
            echo "::error::artifacts/svm/ is out of date. Run \`cd SVM/oku-programs && anchor build --ignore-keys && npm run export-idls\` and commit the result."
            git status --porcelain artifacts/svm/
            git diff artifacts/svm/ | head -200
            exit 1
          fi

      - name: Typecheck
        # The SVM suite passed `tsc` with 21 errors for a long time because
        # `tsx` transpiles without typechecking. With the backend owning most
        # of the protocol's levers, the off-chain code is MORE load-bearing,
        # not less — so this is gated rather than advisory.
        run: npm run typecheck

      - name: Upgrade-tooling unit tests
        run: npm run test:scripts

      # The bankrun harness overrides the Token-2022 program with a mainnet
      # dump (ScaledUiAmount support); it is not committed, so fetch it.
      - name: Fetch Token-2022 program
        run: make fetch-token-2022

      - name: Run bankrun test suite
        run: npm run test:bankrun

      # Random instruction sequences checked against a model after every step
      # (SVM counterpart of the EVM invariant suites). Short here; run with
      # FUZZ_SEEDS=200 FUZZ_STEPS=500 for a deep pass.
      - name: Run lite_psm sequence fuzz
        run: FUZZ_SEEDS=6 FUZZ_STEPS=200 npm run test:fuzz

      # NOTE: a "Trident harness compile smoke" step used to sit here, pointing
      # at SVM/oku-programs/trident-tests. That directory does not exist in the
      # repository, so the step could only ever fail. Removed rather than left
      # red; if the Trident harness is reinstated, restore the step with it.

  # ---------------------------------------------------------------------------
  # SVM: cargo unit tests only (fast, no Solana toolchain needed)
  # ---------------------------------------------------------------------------
  svm-cargo:
    name: SVM (cargo test --workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVM/oku-programs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('SVM/oku-programs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-unit-

      - name: Run cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo unit tests
        run: cargo test --workspace --lib --quiet

      # ---------------------------------------------------------------------
      # Kani: every harness kept in oku-shared discharges in seconds. Scope to
      # --package oku-shared: lite-psm pulls in the Anchor/Solana graph, which
      # Kani is not set up to codegen.
      # ---------------------------------------------------------------------
      - name: Cache Kani
        uses: actions/cache@v4
        id: kani-cache
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-0.67.0

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      - name: Run Kani
        timeout-minutes: 10
        run: |
          cargo kani --package oku-shared

      - name: Cache cargo-llvm-cov binary
        uses: actions/cache@v4
        id: cargo-llvm-cov-cache
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.8

      - name: Install cargo-llvm-cov
        if: steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Run cargo llvm-cov on oku-shared (pure-math crate, line threshold = 90%)
        run: |
          # JSON output is parser-friendly (vs. the rendered text table).
          cargo llvm-cov --package oku-shared --lib --json --summary-only > coverage.json
          cargo llvm-cov --package oku-shared --lib --summary-only

          # Gate: oku-shared TOTAL line coverage must be >= 90%.
          PCT=$(node -e "const d=require('./coverage.json'); console.log(d.data[0].totals.lines.percent.toFixed(2));")
          echo "oku-shared total line coverage: ${PCT}%"
          awk -v pct="$PCT" 'BEGIN { if (pct + 0 < 90.0) { print "::error::oku-shared line coverage " pct "% is below 90% threshold"; exit 1 } }'

  # ---------------------------------------------------------------------------
  # SVM: supply-chain hygiene (cargo-deny)
  # ---------------------------------------------------------------------------
  svm-deny:
    name: SVM (cargo deny check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVM/oku-programs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny binary
        uses: actions/cache@v4
        id: cargo-deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.16

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # Cross-stack: the three implementations of computeMultiplier must agree
  #
  # Solidity (src/lib/MathLib.sol), Rust (oku-shared/src/rate.rs) and TypeScript
  # (packages/yield-tooling) all compute the multiplier, and NOTHING on-chain on
  # either stack can detect a divergence between them -- each deployment is
  # independent, with no messaging. This job regenerates the vector corpus from
  # the Solidity reference and replays it against the other two.
  #
  # It also fails if the committed corpus is stale, which is the point: a change
  # to MathLib.sol that is not reflected in the other two shows up here rather
  # than as chains quietly disagreeing about how much everyone owns.
  # ---------------------------------------------------------------------------
  differential:
    name: Cross-stack differential (Solidity vs Rust vs TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install workspace dependencies
        run: npm ci

      - name: Regenerate vectors from the Solidity reference
        working-directory: EVM
        run: forge test --match-contract GenerateVectors -vv

      - name: Fail if the committed corpus is stale
        run: |
          if ! git diff --quiet -- EVM/test/differential/vectors.jsonl; then
            echo "::error::The committed differential corpus does not match what"
            echo "::error::MathLib.sol currently produces. Regenerate it and"
            echo "::error::re-run the Rust and TypeScript replays:"
            echo "::error::  npm run test:differential"
            git diff --stat -- EVM/test/differential/vectors.jsonl
            exit 1
          fi

      - name: Replay against TypeScript
        run: npm run test:tooling

      - name: Replay against Rust
        working-directory: SVM/oku-programs
        run: cargo test --package oku-shared --test differential -- --nocapture
