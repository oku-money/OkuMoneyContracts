[package]
name = "lite-psm"
version = "0.1.0"
description = "LitePSM - USDC to OkuMoney peg stability module"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lite_psm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }
solana-keccak-hasher = "3.1"
solana-instructions-sysvar = "3.0"
solana-pubkey = "3.0"
solana-security-txt = "1.1"
# Protocol-wide constants + pure-math primitives. See `crates/oku-shared`.
oku-shared = { path = "../../crates/oku-shared" }
