[profile.default]
src = "src"
# Allow the differential-vector generator to write its corpus. Scoped to the
# single directory it owns — see test/differential/GenerateVectors.t.sol.
fs_permissions = [{ access = "read-write", path = "./test/differential" }]

out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"

# Do NOT embed the source-text metadata hash in creation bytecode.
#
# Left at solc's default (`ipfs`), the compiler derives a metadata hash from the
# SOURCE TEXT — comments included — and appends it to every contract's initCode.
# Under CREATE2 the address is a function of initCode, so editing a single
# NatSpec line moves every deployed address and invalidates block-explorer
# verification. That made documentation changes a redeploy-gated operation.
#
# With "none" the address depends only on code semantics and the pinned solc
# version. Must stay in sync with `settings.metadata.bytecodeHash` in
# `hardhat.config.ts` — if the two toolchains disagree, they compile the same
# source to different addresses.
bytecode_hash = "none"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Test settings
verbosity = 2
fuzz = { runs = 256 }
# Explicit invariant config (was previously relying on Foundry defaults,
# which happen to match: 256 runs x 500 depth).
invariant = { runs = 256, depth = 500 }

# Gas reporting
gas_reports = ["*"]

# Additional remappings (add your dependencies here)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Formatting options (for forge fmt)
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# Lint configuration
[lint]
# reentrancy-events: every external call in src/ is to the configured USDC or the protocol's
#   own OkuMoney/OkuDollar (no callbacks), and the flagged emits report values fixed before it.
# block-timestamp: the rate schedule is defined in wall-clock seconds by design.
exclude_lints = ["asm-keccak256", "reentrancy-events", "block-timestamp"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
