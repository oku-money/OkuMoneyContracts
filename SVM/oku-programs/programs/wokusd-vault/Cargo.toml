[package]
name = "wokusd-vault"
version = "0.1.0"
description = "wOkuUSD vault - wrap/unwrap OkuUSD to wOkuUSD"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wokusd_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
