[package]
name = "oku-dollar"
version = "0.1.0"
description = "OkuDollar vault - rebasing $1-pegged stablecoin backed by OkuMoney"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "oku_dollar"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
lite-psm = { path = "../lite-psm", features = ["cpi"] }
solana-security-txt = "1.1"
# Protocol-wide constants + pure-math primitives. See `crates/oku-shared`.
oku-shared = { path = "../../crates/oku-shared" }
