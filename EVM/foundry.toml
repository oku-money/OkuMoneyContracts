[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Test settings
verbosity = 2
fuzz = { runs = 256 }
# Explicit invariant config (was previously relying on Foundry defaults,
# which happen to match: 256 runs x 500 depth).
invariant = { runs = 256, depth = 500 }

# Gas reporting
gas_reports = ["*"]

# Additional remappings (add your dependencies here)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Formatting options (for forge fmt)
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# Lint configuration
[lint]
# asm-keccak256   — MathLib.rpow is MakerDAO's pot.sol assembly, kept verbatim.
# erc20-unchecked-transfer — every `transfer` in this tree targets either OkuDollar
#   (OZ ERC20, which reverts rather than returning false) or MockUSDC in tests.
#   The one place a non-conforming false-return matters is
#   RedemptionQueue.processQueue, which handles it explicitly via
#   `_trySafeTransferFrom` and is covered by QueueSkipPathsTest.
exclude_lints = ["asm-keccak256", "erc20-unchecked-transfer"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
