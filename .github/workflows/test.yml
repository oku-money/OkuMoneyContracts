name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ---------------------------------------------------------------------------
  # EVM: forge test + hardhat compile/test + ABI drift check
  # ---------------------------------------------------------------------------
  check:
    name: EVM (Foundry + Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EVM
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Compile with Hardhat
        run: npx hardhat compile

      - name: Run Hardhat tests
        run: npx hardhat test

      - name: Export ABIs
        run: npm run export-abis

      - name: Check exported artifacts are up to date
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain artifacts/evm/)" ]; then
            echo "::error::artifacts/evm/ is out of date. Run \`cd EVM && npx hardhat compile && npm run export-abis\` and commit the result."
            git status --porcelain artifacts/evm/
            git diff artifacts/evm/ | head -200
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # SVM: Anchor build + bankrun tests + cargo unit tests
  #
  # Uses Solana v3.1.10 + Anchor CLI v1.0.0 to match Anchor.toml [toolchain].
  # The bankrun suite (litesvm, in-process) does NOT require a running validator.
  # ---------------------------------------------------------------------------
  svm-tests:
    name: SVM (Anchor build + bankrun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVM/oku-programs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('SVM/oku-programs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Solana install
        uses: actions/cache@v4
        id: solana-cache
        with:
          path: ~/.local/share/solana
          key: solana-3.1.10

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Anchor CLI
        uses: actions/cache@v4
        id: anchor-cache
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-1.0.0

      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v1.0.0 anchor-cli --locked --force

      - name: Show tool versions
        run: |
          solana --version
          anchor --version
          node --version

      - name: Generate Solana keypair for CI
        run: solana-keygen new --no-bip39-passphrase --silent

      - name: Install npm dependencies
        run: npm ci

      - name: Build Anchor programs
        run: anchor build

      - name: Run bankrun test suite
        run: npm run test:bankrun

  # ---------------------------------------------------------------------------
  # SVM: cargo unit tests only (fast, no Solana toolchain needed)
  # ---------------------------------------------------------------------------
  svm-cargo:
    name: SVM (cargo test --workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVM/oku-programs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('SVM/oku-programs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-unit-

      - name: Run cargo unit tests
        run: cargo test --workspace --lib --quiet
