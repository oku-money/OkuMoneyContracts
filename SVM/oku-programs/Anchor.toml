[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.devnet]
lite_psm = "4k5gmUhtp3XqW2zf3XzdquMTSyMVfgA5TubuinTSUjNN"

[programs.localnet]
lite_psm = "4k5gmUhtp3XqW2zf3XzdquMTSyMVfgA5TubuinTSUjNN"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --workspace --quiet && RUST_LOG= npx mocha --require tsx --timeout 60000 'tests/bankrun/**/*.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false
