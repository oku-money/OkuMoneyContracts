[package]
name = "wokusd-vault"
version = "0.1.0"
description = "wOkuUSD vault - wrap/unwrap OkuUSD to wOkuUSD"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wokusd_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
