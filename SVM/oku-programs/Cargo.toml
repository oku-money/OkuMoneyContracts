[workspace]
members = [
    "programs/*",
    "crates/*"
]
resolver = "2"

# `programs/*` are the Anchor on-chain programs (`cdylib` + `lib`).
# `crates/*` are pure-Rust workspace libraries used by those programs.
# Splitting them keeps `anchor build` (which walks `programs/*` and
# requires the `idl-build` feature on every member) honest.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
