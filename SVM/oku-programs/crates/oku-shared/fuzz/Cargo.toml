[package]
name = "oku-shared-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oku-shared = { path = ".." }

# Disable overflow-checks for the fuzz crate itself so that
# cargo-fuzz's sanitizers (ASAN, UBSan) can catch overflows
# rather than Rust's built-in panic, which would mask the bug.
[[bin]]
name = "mul_div_floor"
path = "fuzz_targets/mul_div_floor.rs"
test = false
doc = false

[[bin]]
name = "oku_m_to_dollars"
path = "fuzz_targets/oku_m_to_dollars.rs"
test = false
doc = false

[[bin]]
name = "dollars_to_oku_m"
path = "fuzz_targets/dollars_to_oku_m.rs"
test = false
doc = false

[[bin]]
name = "calculate_fee"
path = "fuzz_targets/calculate_fee.rs"
test = false
doc = false

# F-05: fuzz coverage for the two-multiplier vault share round-trip
# (oku_money_to_shares → shares_to_oku_money in oku-dollar).
[[bin]]
name = "vault_share_round_trip"
path = "fuzz_targets/vault_share_round_trip.rs"
test = false
doc = false

# Cycle 4 (S-26): fuzz coverage for the collateral-ratio primitive
# (`oku_shared::vault_math::collateral_ratio`). Three-way widening
# multiplication, two sentinel branches — exactly the kind of math
# that benefits from full-u64 randomized inputs cross-checked
# against a u128 reference implementation.
[[bin]]
name = "collateral_ratio"
path = "fuzz_targets/collateral_ratio.rs"
test = false
doc = false

# Cycle 4: fuzz coverage for the new `mul_div_ceil` primitive.
# Same shape as `mul_div_floor` with the `+ (d-1)` numerator
# adjustment that needs its own overflow-safety witness.
[[bin]]
name = "mul_div_ceil"
path = "fuzz_targets/mul_div_ceil.rs"
test = false
doc = false
