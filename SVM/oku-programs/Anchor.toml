[toolchain]
anchor_version = "1.0.0"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.devnet]
lite_psm = "3CLDWjDTtvWcRr1iNS9SRtDvqXgEZLm6hq1P6426YC7N"
oku_dollar = "3TeNwAqQxxGZwF7LSveLcVEKZ5tuXNKSvfMj6nz3PJgy"

[programs.localnet]
lite_psm = "3CLDWjDTtvWcRr1iNS9SRtDvqXgEZLm6hq1P6426YC7N"
oku_dollar = "3TeNwAqQxxGZwF7LSveLcVEKZ5tuXNKSvfMj6nz3PJgy"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` is kept synonymous with `npm test`: runs the Rust unit
# tests (oku-shared math + per-program helpers) first, then the bankrun
# in-process suite. Fork tests need surfpool (`npm run test:fork`). The
# legacy `solana-test-validator` path was retired in Phase 11.
#
# `RUST_LOG=` silences the verbose `solana_program_test` /
# `solana_runtime::message_processor::stable_log` lines that bankrun's
# native binding pipes to stderr by default. Programs' on-failure logs
# still surface via Anchor's error pipeline; this only mutes the
# always-on `invoke`/`success` tracing.
test = "cargo test --workspace --quiet && RUST_LOG= npx mocha --require tsx --timeout 60000 'tests/bankrun/**/*.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false
